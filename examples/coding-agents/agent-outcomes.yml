# agent-outcomes v3
# Amplitude Agent Analytics: score coding-agent sessions with code outcomes (merged,
# reverted, deployed, first-run CI, review). Each outcome is an [Agent] Score on the
# session that wrote the commit, so only commits with an Agent-Session-Id trailer
# (from the prepare-commit-msg hook) are scored. Installed by `amplitude-ai coding-agents init`.
#
# Setup:
#   - Repository secret AMPLITUDE_API_KEY: the Amplitude project API key.
#   - Optional variable AMPLITUDE_REGION: "eu" for the EU data center (default US).
#   - Optional variable AMPLITUDE_OUTCOMES_DRY_RUN: "true" prints events instead of sending.
#   - Optional variable AMPLITUDE_USER_ID_SOURCE: "email" (default, commit author email)
#     or "login" (GitHub login). Use the value your agent sessions use as user ID.
#   - Optional variable AMPLITUDE_AGENT_SETUP_PATHS: comma-separated root-level files or
#     folders that make up the agent setup (default AGENTS.md,CLAUDE.md,GEMINI.md,.claude,.codex,
#     .cursor,.cursorrules,.gemini,.goosehints,.mcp.json). Changing it changes every later version.
name: Agent outcomes (Amplitude)

on:
  pull_request:
    types: [closed]
  deployment_status:

permissions:
  contents: read
  pull-requests: read
  deployments: read
  checks: read
  statuses: read
  actions: read

jobs:
  outcomes:
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true) ||
      (github.event_name == 'deployment_status' &&
        contains(fromJSON('["success","failure","error"]'), github.event.deployment_status.state))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          AMPLITUDE_API_KEY: ${{ secrets.AMPLITUDE_API_KEY }}
          AMPLITUDE_REGION: ${{ vars.AMPLITUDE_REGION }}
          AMPLITUDE_OUTCOMES_DRY_RUN: ${{ vars.AMPLITUDE_OUTCOMES_DRY_RUN }}
          AMPLITUDE_USER_ID_SOURCE: ${{ vars.AMPLITUDE_USER_ID_SOURCE }}
          AMPLITUDE_AGENT_SETUP_PATHS: ${{ vars.AMPLITUDE_AGENT_SETUP_PATHS }}
        with:
          script: |
            const crypto = require('crypto');
            const WORKFLOW_VERSION = 3;
            const { owner, repo } = context.repo;
            const repoName = `${owner}/${repo}`;
            const dryRun = process.env.AMPLITUDE_OUTCOMES_DRY_RUN === 'true';
            const apiKey = process.env.AMPLITUDE_API_KEY;
            if (!apiKey && !dryRun) {
              const head = context.payload.pull_request?.head?.repo;
              if (context.eventName === 'pull_request' && (!head || head.full_name !== repoName)) {
                core.notice('Pull request from a fork: repository secrets are not available to this run, so no outcome events were sent.');
                return;
              }
              core.setFailed('AMPLITUDE_API_KEY secret is not set');
              return;
            }
            const endpoint = (process.env.AMPLITUDE_REGION || '').toLowerCase() === 'eu'
              ? 'https://api.eu.amplitude.com/2/httpapi'
              : 'https://api2.amplitude.com/2/httpapi';
            const userIdSource = (process.env.AMPLITUDE_USER_ID_SOURCE || 'email').toLowerCase();

            const trailer = (message, key) => {
              const re = new RegExp(`^${key}:\\s*(\\S+)\\s*$`, 'gim');
              let match, value = null;
              while ((match = re.exec(message)) !== null) value = match[1];
              return value;
            };
            const userIdFor = (c) => {
              if (userIdSource === 'login') return c.author?.login || null;
              return c.commit?.author?.email || null;
            };
            // Coding agents that sign the commits they write, by commit email. GitHub
            // noreply emails carry a fixed account ID, so a changed display name still matches.
            const AGENT_EMAILS = {
              'cursoragent@cursor.com': 'cursor',
              '206951365+cursor[bot]@users.noreply.github.com': 'cursor',
              'noreply@anthropic.com': 'claude-code',
              '209825114+claude[bot]@users.noreply.github.com': 'claude-code',
              '198982749+copilot@users.noreply.github.com': 'copilot',
              '223556219+copilot@users.noreply.github.com': 'copilot',
              '158243242+devin-ai-integration[bot]@users.noreply.github.com': 'devin',
              '243557089+warp-factories[bot]@users.noreply.github.com': 'warp',
            };
            const agentForEmail = (email) => AGENT_EMAILS[(email || '').trim().toLowerCase()] || null;
            const sessionOf = (c) => trailer(c.commit.message, 'Agent-Session-Id');
            // The agent that signed the commit: its commit author email, else its Co-authored-by line.
            const signingAgent = (c) => {
              const author = agentForEmail(c.commit?.author?.email);
              if (author) return { agent: author, authored: true };
              for (const m of c.commit.message.matchAll(/^co-authored-by:.*<([^>]+)>\s*$/gim)) {
                const coAuthor = agentForEmail(m[1]);
                if (coAuthor) return { agent: coAuthor, authored: false };
              }
              return { agent: null, authored: false };
            };
            // The hook's Agent-Name values (claude-code, codex, cursor, goose) are the
            // [Agent] Agent ID each harness's own events carry.
            const agentIdFor = (c) => trailer(c.commit.message, 'Agent-Name') || signingAgent(c).agent;
            // How the agent's session started: the Agent-Trigger trailer, else `event` for a
            // commit a bot agent authored (cloud agents run from an issue or an assignment).
            const TRIGGERS = ['interactive', 'headless', 'ci', 'scheduled', 'event'];
            const agentTrigger = (c) => {
              const value = trailer(c.commit.message, 'Agent-Trigger');
              if (TRIGGERS.includes(value)) return value;
              return signingAgent(c).authored ? 'event' : null;
            };
            const baseProps = (c) => ({
              commit_sha: c.sha,
              agent_session_id: sessionOf(c),
              agent_name: trailer(c.commit.message, 'Agent-Name'),
              agent_trigger: agentTrigger(c),
              repo: repoName,
            });
            const hoursBetween = (from, to) => Math.round(((Date.parse(to) - Date.parse(from)) / 3600000) * 100) / 100;
            const authoredAt = (c) => {
              const t = Date.parse(c.commit?.author?.date || '');
              return Number.isNaN(t) ? null : t;
            };

            // One [Agent] Score per outcome, on the session that wrote the commit. The
            // event time is the commit's author date, which falls inside the session, so
            // the session keeps the start and end its own events gave it; outcome_time is
            // when the outcome happened. A value that is undefined or null is not sent, and
            // neither is a score for a commit without an author date.
            const events = [];
            const pushScore = (name, value, c, props, insertKey, outcomeTime, userId = userIdFor(c)) => {
              const sessionId = sessionOf(c);
              const time = authoredAt(c);
              if (!sessionId || !userId || time === null || value === undefined || value === null) return;
              events.push({
                event_type: '[Agent] Score',
                user_id: userId,
                insert_id: `${name}:${repoName}:${insertKey}`,
                time,
                event_properties: {
                  '[Agent] Score Name': name,
                  '[Agent] Score Value': value,
                  '[Agent] Session ID': sessionId,
                  '[Agent] Target ID': sessionId,
                  '[Agent] Target Type': 'session',
                  '[Agent] Agent ID': agentIdFor(c),
                  '[Agent] Evaluation Source': 'outcome',
                  ...baseProps(c),
                  ...props,
                  outcome_time: new Date(outcomeTime).toISOString(),
                  outcomes_workflow_version: WORKFLOW_VERSION,
                },
              });
            };

            // Enrichments are best effort: each one is isolated, and together they
            // make at most API_BUDGET GitHub API calls. A failed enrichment omits
            // its property; the outcome events are still sent.
            const API_BUDGET = 300;
            let apiCalls = 0;
            const enrichment = {};
            class BudgetExhausted extends Error {}
            const spend = () => {
              if (apiCalls >= API_BUDGET) throw new BudgetExhausted(`API budget of ${API_BUDGET} calls used up`);
              apiCalls++;
            };
            const call = (fn) => {
              spend();
              return fn();
            };
            // Iterates a paginated list, one budget call per page requested.
            const pagesOf = async function* (method, params) {
              const pages = github.paginate.iterator(method, { ...params, per_page: 100 })[Symbol.asyncIterator]();
              for (;;) {
                spend();
                const { value, done } = await pages.next();
                if (done) {
                  apiCalls--;
                  return;
                }
                yield value.data;
              }
            };
            const listAll = async (method, params) => {
              const items = [];
              for await (const page of pagesOf(method, params)) items.push(...page);
              return items;
            };
            const enrich = async (name, fn) => {
              try {
                const value = await fn();
                if (!enrichment[name]) enrichment[name] = 'ok';
                return value;
              } catch (e) {
                const status = e instanceof BudgetExhausted ? 'budget' : 'error';
                if (enrichment[name] !== status) core.warning(`${name} omitted: ${e.message}`);
                enrichment[name] = status;
                return undefined;
              }
            };

            const DEFAULT_SETUP_PATHS = [
              'AGENTS.md', 'CLAUDE.md', 'GEMINI.md', '.claude', '.codex', '.cursor', '.cursorrules', '.gemini',
              '.goosehints', '.mcp.json',
            ];
            const setupPaths = (() => {
              const raw = (process.env.AMPLITUDE_AGENT_SETUP_PATHS || '').trim();
              if (!raw) return DEFAULT_SETUP_PATHS;
              const names = [...new Set(raw.split(',').map((s) => s.trim()).filter(Boolean))];
              const valid = names.filter((n) => !/[\\/]/.test(n) && n !== '.' && n !== '..');
              if (valid.length !== names.length) core.warning('AMPLITUDE_AGENT_SETUP_PATHS: ignored names that are not root-level entries');
              if (valid.length > 20) core.warning('AMPLITUDE_AGENT_SETUP_PATHS: using the first 20 names');
              return valid.slice(0, 20);
            })();
            const treeOf = new Map();
            const remember = (c) => {
              if (c?.sha && c.commit?.tree?.sha) treeOf.set(c.sha, c.commit.tree.sha);
            };
            const treeForCommit = async (sha) => {
              if (!treeOf.has(sha)) {
                const { data } = await call(() => github.rest.git.getCommit({ owner, repo, commit_sha: sha }));
                treeOf.set(sha, data.tree.sha);
              }
              return treeOf.get(sha);
            };
            const setupByTree = new Map();
            const setupVersionForTree = async (treeSha) => {
              if (!setupByTree.has(treeSha)) {
                const { data } = await call(() => github.rest.git.getTree({ owner, repo, tree_sha: treeSha }));
                const wanted = new Set(setupPaths);
                const lines = data.tree.filter((e) => wanted.has(e.path)).map((e) => `${e.path}:${e.sha}`).sort();
                setupByTree.set(treeSha, lines.length
                  ? crypto.createHash('sha256').update(lines.join('\n')).digest('hex').slice(0, 12)
                  : null);
              }
              return setupByTree.get(treeSha);
            };
            // The setup a commit was written with: the setup files in its parent's tree.
            const setupVersionFor = (c) => enrich('agent_setup_version', async () => {
              const parent = c.parents?.[0]?.sha;
              if (!parent) return null;
              return setupVersionForTree(await treeForCommit(parent));
            });

            const PASSED = new Set(['success', 'neutral', 'skipped']);
            const FAILED = new Set(['failure', 'timed_out', 'action_required', 'startup_failure']);
            // The head SHA of the PR's first pull_request workflow run, which is the
            // first push CI ran on. A push of many commits runs CI on its head only, so
            // the PR's oldest commits can have none. GitHub empties a run's
            // pull_requests once the PR closes, so runs match by the PR's commit SHAs
            // between open and merge; after a force-push, the earliest surviving push
            // counts. This workflow's own runs are not CI. Undefined when no run
            // matches or the run history is too long to page.
            const selfWorkflow = (process.env.GITHUB_WORKFLOW_REF || '')
              .replace(/^[^/]+\/[^/]+\//, '').replace(/@.*$/, '');
            const firstRunSha = async (pr, commits) => {
              const prShas = new Set(commits.map((c) => c.sha));
              const opened = new Date(pr.created_at);
              const merged = pr.merged_at ? new Date(pr.merged_at) : new Date();
              let first = null;
              let page = 0;
              for await (const runs of pagesOf(github.rest.actions.listWorkflowRunsForRepo, {
                owner, repo, branch: pr.head.ref, event: 'pull_request',
                created: `${opened.toISOString()}..${merged.toISOString()}`,
              })) {
                for (const run of runs) {
                  const created = new Date(run.created_at);
                  if (created < opened || created >= merged) continue;
                  if (run.id === context.runId || (selfWorkflow && run.path === selfWorkflow)) continue;
                  const ours = prShas.has(run.head_sha)
                    || (run.pull_requests || []).some((p) => p.number === pr.number);
                  if (ours && (!first || created < new Date(first.created_at))) first = run;
                }
                if (runs.length < 100) return first?.head_sha;
                if (++page >= 5) return undefined;
              }
              return first?.head_sha;
            };
            const ciResults = async (sha) => {
              const runs = await listAll(github.rest.checks.listForRef, { owner, repo, ref: sha, filter: 'all' });
              const statuses = await listAll(github.rest.repos.listCommitStatusesForRef, { owner, repo, ref: sha });
              const earliest = (items, key, counts) => {
                const first = new Map();
                for (const item of items) {
                  if (!counts(item)) continue;
                  const k = key(item);
                  if (!first.has(k) || item.id < first.get(k).id) first.set(k, item);
                }
                return [...first.values()];
              };
              return [
                ...earliest(runs, (r) => `${r.app?.id ?? ''}:${r.name}`,
                  (r) => PASSED.has(r.conclusion) || FAILED.has(r.conclusion)).map((r) => PASSED.has(r.conclusion)),
                ...earliest(statuses, (s) => s.context,
                  (s) => ['success', 'failure', 'error'].includes(s.state)).map((s) => s.state === 'success'),
              ];
            };
            // The first CI result on the PR: the earliest attempt of each check and
            // status on the first push CI ran on. Without Actions runs, the first of
            // the PR's oldest 20 commits that has results. Cancelled and unfinished
            // runs do not count. Undefined when the PR has no CI.
            const ciPassedFirstRun = (pr, commits) => enrich('ci_passed_first_run', async () => {
              let runSha;
              try {
                runSha = await firstRunSha(pr, commits);
              } catch (e) {
                if (e instanceof BudgetExhausted) throw e;
                core.warning(`ci_passed_first_run: workflow runs unavailable (${e.message}); using the PR's oldest commits`);
              }
              const shas = runSha ? [runSha] : commits.slice(0, 20).map((c) => c.sha);
              for (const sha of shas) {
                const results = await ciResults(sha);
                if (results.length) return results.every(Boolean);
              }
              return undefined;
            });

            if (context.eventName === 'pull_request') {
              const pr = context.payload.pull_request;
              const commits = await github.paginate(github.rest.pulls.listCommits, {
                owner, repo, pull_number: pr.number, per_page: 100,
              });
              commits.forEach(remember);
              const reverted = new Set();
              const revertRe = /This reverts commit ([0-9a-f]{7,40})/gi;
              for (const text of [pr.body || '', ...commits.map((c) => c.commit.message)]) {
                let m;
                while ((m = revertRe.exec(text)) !== null) reverted.add(m[1].toLowerCase());
              }
              const mergedAt = pr.merged_at ? Date.parse(pr.merged_at) : Date.now();
              const agentCommits = commits.filter(sessionOf);
              const sessions = new Map();
              for (const c of agentCommits) {
                if (!sessions.has(sessionOf(c))) sessions.set(sessionOf(c), []);
                sessions.get(sessionOf(c)).push(c);
              }
              // The PR-level enrichments are cheap, so they run before the per-commit
              // setup lookups that can use up the budget on a long PR.
              let reviews, ciPassed;
              if (sessions.size) {
                reviews = await enrich('reviews', async () => {
                  const all = await listAll(github.rest.pulls.listReviews, { owner, repo, pull_number: pr.number });
                  // A reply in a review thread is an empty COMMENTED review; it is not a review.
                  return all.filter((r) => (['APPROVED', 'CHANGES_REQUESTED'].includes(r.state)
                    || (r.state === 'COMMENTED' && (r.body || '').trim()))
                    && r.user?.type !== 'Bot' && r.user?.login !== pr.user?.login);
                });
                ciPassed = await ciPassedFirstRun(pr, commits);
              }
              const setupVersions = new Map();
              for (const c of agentCommits) setupVersions.set(c.sha, await setupVersionFor(c));
              for (const c of agentCommits) {
                pushScore('commit_merged', 1, c, {
                  merge_commit_sha: pr.merge_commit_sha,
                  pr_number: pr.number,
                  base_branch: pr.base.ref,
                  agent_setup_version: setupVersions.get(c.sha),
                }, c.sha, mergedAt);
              }
              for (const sha of reverted) {
                let original;
                try {
                  original = (await github.rest.repos.getCommit({ owner, repo, ref: sha })).data;
                } catch (e) {
                  core.warning(`Reverted commit ${sha} not found: ${e.message}`);
                  continue;
                }
                remember(original);
                if (!sessionOf(original)) continue;
                pushScore('commit_reverted', 1, original, {
                  revert_pr_number: pr.number,
                  revert_merge_commit_sha: pr.merge_commit_sha,
                  agent_setup_version: await setupVersionFor(original),
                }, `${original.sha}:${pr.number}`, mergedAt);
              }

              // Review timing uses the human reviews above. A round is a change request the
              // author answered with a later commit. Not sent, like review_count, when the reviews
              // enrichment failed; hours_to_first_review is not sent when no review counted.
              const submitted = (reviews || []).map((r) => r.submitted_at).filter(Boolean)
                .sort((a, b) => Date.parse(a) - Date.parse(b));
              const committedAt = commits.map((c) => c.commit?.committer?.date).filter(Boolean);
              const prScores = {
                ci_passed_first_run: ciPassed === undefined ? undefined : Number(ciPassed),
                review_rounds: reviews ? reviews.filter((r) => r.state === 'CHANGES_REQUESTED' && r.submitted_at
                  && committedAt.some((d) => Date.parse(d) > Date.parse(r.submitted_at))).length : undefined,
                review_count: reviews?.length,
                changes_requested_count: reviews?.filter((r) => r.state === 'CHANGES_REQUESTED').length,
                hours_open: pr.merged_at ? hoursBetween(pr.created_at, pr.merged_at) : undefined,
                hours_to_first_review: submitted.length ? hoursBetween(pr.created_at, submitted[0]) : undefined,
              };
              // PR scores go on every agent session in the PR, each on its first commit.
              // Count a PR once with distinct pr_number.
              for (const [sessionId, own] of sessions) {
                const first = own[0];
                const userId = userIdFor(first) || (userIdSource === 'login' ? pr.user?.login : null);
                const props = {
                  pr_number: pr.number,
                  base_branch: pr.base.ref,
                  merge_commit_sha: pr.merge_commit_sha,
                  commit_count: pr.commits ?? commits.length,
                  agent_commit_count: agentCommits.length,
                  session_commit_count: own.length,
                  pr_session_count: sessions.size,
                  agent_setup_version: setupVersions.get(first.sha),
                };
                for (const [name, value] of Object.entries(prScores)) {
                  pushScore(name, value, first, props, `${pr.number}:${sessionId}`, mergedAt, userId);
                }
              }
            } else {
              const deployment = context.payload.deployment;
              const state = context.payload.deployment_status.state;
              const environment = deployment.environment;
              let previousSha = null;
              let pagesRead = 0;
              search: for await (const page of github.paginate.iterator(github.rest.repos.listDeployments, {
                owner, repo, environment, per_page: 100,
              })) {
                for (const d of page.data) {
                  if (d.id === deployment.id || new Date(d.created_at) >= new Date(deployment.created_at)) continue;
                  const statuses = await github.rest.repos.listDeploymentStatuses({
                    owner, repo, deployment_id: d.id, per_page: 10,
                  });
                  if (statuses.data.some((s) => s.state === 'success')) { previousSha = d.sha; break search; }
                }
                if (++pagesRead >= 5) break;
              }
              let commits;
              if (previousSha) {
                commits = [];
                for (let page = 1; ; page++) {
                  const cmp = await github.rest.repos.compareCommitsWithBasehead({
                    owner, repo, basehead: `${previousSha}...${deployment.sha}`, per_page: 100, page,
                  });
                  commits.push(...cmp.data.commits);
                  if (cmp.data.commits.length < 100 || commits.length >= cmp.data.total_commits) break;
                }
              } else {
                commits = [(await github.rest.repos.getCommit({ owner, repo, ref: deployment.sha })).data];
              }
              commits.forEach(remember);
              // A squash or rebase merge writes new commits, and a squash commit keeps
              // neither the trailers nor the author date. So a deployed commit stands for
              // its merged PR's commits, each scored once on the session that wrote it. A
              // commit with no merged PR, or whose lookup fails, stands for itself.
              const scored = new Map();
              const seen = new Set();
              const listedPrs = new Set();
              for (const c of commits) {
                if (seen.has(c.sha)) continue;
                seen.add(c.sha);
                const fromPr = await enrich('deployed_prs', async () => {
                  const { data: prs } = await call(() => github.rest.repos.listPullRequestsAssociatedWithCommit({
                    owner, repo, commit_sha: c.sha,
                  }));
                  const pr = prs.find((p) => p.merged_at && p.merge_commit_sha === c.sha) || prs.find((p) => p.merged_at);
                  if (!pr) return null;
                  if (listedPrs.has(pr.number)) return [];
                  listedPrs.add(pr.number);
                  return listAll(github.rest.pulls.listCommits, { owner, repo, pull_number: pr.number });
                });
                if (!fromPr) {
                  scored.set(c.sha, c);
                  continue;
                }
                for (const pc of fromPr) {
                  remember(pc);
                  seen.add(pc.sha);
                  scored.set(pc.sha, pc);
                }
              }
              const succeeded = state === 'success';
              const deployedAt = Date.parse(context.payload.deployment_status.created_at || '') || Date.now();
              for (const c of [...scored.values()].filter(sessionOf)) {
                pushScore(succeeded ? 'deploy_succeeded' : 'deploy_failed', 1, c, {
                  deployment_sha: deployment.sha,
                  environment,
                  ...(succeeded ? {} : { deployment_state: state }),
                  agent_setup_version: await setupVersionFor(c),
                }, `${c.sha}:${deployment.id}`, deployedAt);
              }
            }

            const scoredSessions = new Set(events.map((e) => e.event_properties['[Agent] Session ID'])).size;
            core.info(`${events.length} outcome scores on ${scoredSessions} agent sessions`);
            const enrichments = Object.entries(enrichment).map(([k, v]) => `${k}=${v}`).join(', ') || 'none';
            core.info(`enrichments: ${enrichments}; ${apiCalls}/${API_BUDGET} API calls`);
            if (events.length === 0) return;
            if (dryRun) {
              core.info(JSON.stringify(events, null, 2));
              return;
            }
            for (let i = 0; i < events.length; i += 500) {
              const res = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ api_key: apiKey, events: events.slice(i, i + 500) }),
              });
              if (!res.ok) {
                core.setFailed(`Amplitude HTTP API returned ${res.status}: ${await res.text()}`);
                return;
              }
            }
