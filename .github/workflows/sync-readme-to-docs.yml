name: Sync README to Docs

on:
  push:
    branches: [main]
    paths: [README.md]

env:
  DOCS_REPO: amplitude/amplitude-docs

jobs:
  sync-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 2

      - name: Extract README content and diff
        id: readme
        run: |
          # Preserve the full README without passing it through a shell variable.
          cp README.md /tmp/readme_content.txt

          # Try to diff against previous commit; if README is brand new, use full content as diff
          if git show HEAD~1:README.md > /dev/null 2>&1; then
            git diff HEAD~1 HEAD -- README.md > /tmp/readme_diff.txt
          else
            echo "README.md is new — using full content as diff"
            cp README.md /tmp/readme_diff.txt
          fi

      - name: Dispatch to docs repo
        env:
          GH_TOKEN: ${{ secrets.DOCS_REPO_PAT }}
          SOURCE_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          # Read large multiline values from files to avoid the OS argument-size limit.
          # Keep GitHub context in env vars so commit messages cannot inject into the shell.
          payload=$(jq -n \
            --arg source_repo "$SOURCE_REPO" \
            --rawfile readme_content /tmp/readme_content.txt \
            --rawfile readme_diff /tmp/readme_diff.txt \
            --arg commit_sha "$COMMIT_SHA" \
            --arg commit_message "$COMMIT_MESSAGE" \
            '{
              event_type: "readme-sync",
              client_payload: {
                source_repo: $source_repo,
                readme_content: $readme_content,
                readme_diff: $readme_diff,
                commit_sha: $commit_sha,
                commit_message: $commit_message
              }
            }')

          echo "::group::Dispatching to $DOCS_REPO"
          echo "Source repo: $SOURCE_REPO"
          echo "Commit SHA: $COMMIT_SHA"
          echo "Commit message: $COMMIT_MESSAGE"
          echo "::endgroup::"

          # Use gh api to dispatch — handles auth and encoding
          gh api \
            --method POST \
            "repos/$DOCS_REPO/dispatches" \
            --input - <<< "$payload"

          echo "Successfully dispatched readme-sync event to $DOCS_REPO"
