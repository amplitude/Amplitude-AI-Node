name: Amplitude AI eval gate
description: Pull live Amplitude evaluators and gate a fixture suite in GitHub Actions.
author: Amplitude

inputs:
  project-id:
    description: Amplitude project ID whose live evaluator definitions should be pulled.
    required: true
  config:
    description: Path to amplitude-eval.yaml.
    required: false
    default: amplitude-eval.yaml
  stable-ids:
    description: Optional comma-separated stable evaluator IDs to pull.
    required: false
  amplitude-token:
    description: Amplitude MCP PAT or GitHub-OIDC-exchanged token. Pass as a GitHub secret.
    required: true
  sdk-version:
    description: Released PyPI version of amplitude-ai that includes the evaluator CLI.
    required: true
  python-version:
    description: Python version used to install and run the evaluator CLI.
    required: false
    default: "3.11"
  issue-id:
    description: Optional Quality Issue ID to attach this CI gate run to.
    required: false
  app-id:
    description: Optional Amplitude app ID for the Quality Issue attachment.
    required: false
  agent-analytics-graphql-endpoint:
    description: Optional GraphQL endpoint implementing attachCiGateToIssue.
    required: false
  agent-analytics-authorization:
    description: Optional complete Authorization header value for the GraphQL endpoint. Pass as a secret.
    required: false

outputs:
  result:
    description: "Gate result: pass, threshold_failed, or error."
    value: ${{ steps.gate.outputs.result }}
  exit-code:
    description: amplitude-ai-eval exit code.
    value: ${{ steps.gate.outputs.exit-code }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install evaluator CLI
      shell: bash
      env:
        SDK_VERSION: ${{ inputs.sdk-version }}
      run: python -m pip install --disable-pip-version-check "amplitude-ai==$SDK_VERSION"

    - id: gate
      name: Pull evaluators and run gate
      shell: bash
      env:
        AMP_TOKEN: ${{ inputs.amplitude-token }}
        PROJECT_ID: ${{ inputs.project-id }}
        CONFIG: ${{ inputs.config }}
        STABLE_IDS: ${{ inputs.stable-ids }}
      run: |
        set -uo pipefail
        pull_args=(pull --project-id "$PROJECT_ID" --out .amplitude/evaluators.json)
        if [[ -n "$STABLE_IDS" ]]; then
          pull_args+=(--stable-ids "$STABLE_IDS")
        fi

        set +e
        amplitude-ai-eval "${pull_args[@]}"
        pull_status=$?
        if [[ "$pull_status" -eq 0 ]]; then
          amplitude-ai-eval run "$CONFIG" --evaluators .amplitude/evaluators.json
          gate_status=$?
        else
          gate_status=$pull_status
        fi
        set -e

        case "$gate_status" in
          0) result=pass ;;
          1) result=threshold_failed ;;
          *) result=error ;;
        esac
        {
          echo "result=$result"
          echo "exit-code=$gate_status"
        } >> "$GITHUB_OUTPUT"
        exit "$gate_status"

    - name: Attach gate provenance to Quality Issue
      if: >-
        always() &&
        inputs.issue-id != '' &&
        inputs.app-id != '' &&
        inputs.agent-analytics-graphql-endpoint != '' &&
        inputs.agent-analytics-authorization != ''
      shell: bash
      env:
        ISSUE_ID: ${{ inputs.issue-id }}
        APP_ID: ${{ inputs.app-id }}
        GRAPHQL_ENDPOINT: ${{ inputs.agent-analytics-graphql-endpoint }}
        AUTHORIZATION: ${{ inputs.agent-analytics-authorization }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        RUN_ID: ${{ github.run_id }}
        COMMIT_SHA: ${{ github.sha }}
        PR_URL: ${{ github.event.pull_request.html_url }}
      run: |
        set -euo pipefail
        payload=$(jq -n \
          --arg id "$ISSUE_ID" \
          --arg runId "$RUN_ID" \
          --arg runUrl "$RUN_URL" \
          --arg commitSha "$COMMIT_SHA" \
          --arg prUrl "$PR_URL" \
          --argjson appId "$APP_ID" \
          '{query: "mutation AttachCiGateToIssue($input: AttachCiGateToIssueInput!, $appId: Int!) { attachCiGateToIssue(input: $input, appId: $appId) { id } }", variables: {input: {id: $id, ciGateRunId: $runId, externalRunUrl: $runUrl, commitSha: $commitSha, externalPrUrl: $prUrl}, appId: $appId}}')
        curl --fail-with-body --silent --show-error \
          --header "Authorization: $AUTHORIZATION" \
          --header "Content-Type: application/json" \
          --data "$payload" \
          "$GRAPHQL_ENDPOINT"
